<!DOCTYPE html><html><head><meta charset="utf-8"><title>wtest</title>
<style>html,body{margin:0;background:#1a2233}canvas{display:block}</style>
</head><body>
<canvas id="cv3" width="1200" height="700"></canvas>
<script src="assets3d/three.min.js"></script>
<script src="assets3d/GLTFLoader.js"></script>
<script src="_wt.js"></script>
<script>
(function(){
const renderer=new THREE.WebGLRenderer({canvas:document.getElementById('cv3'),antialias:true});
renderer.setSize(1200,700,false);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x1a2233);
scene.add(new THREE.AmbientLight(0xffffff,0.6));
const dl=new THREE.DirectionalLight(0xffffff,0.9);dl.position.set(3,6,4);scene.add(dl);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(20,10),new THREE.MeshStandardMaterial({color:0x2a3b2a}));
ground.rotation.x=-Math.PI/2;scene.add(ground);
const cam=new THREE.PerspectiveCamera(40,1200/700,0.1,50);cam.position.set(0,1.6,5.2);cam.lookAt(0,0.9,0);
const loader=new THREE.GLTFLoader();const mixers=[];
function buf(b64){const s=atob(b64);const u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u.buffer;}
function put(key,x){loader.parse(buf(WT[key]),'',(g)=>{
 const r=g.scene;const bb=new THREE.Box3().setFromObject(r);
 const s=1.7/bb.getSize(new THREE.Vector3()).y;r.scale.setScalar(s);
 const b2=new THREE.Box3().setFromObject(r);r.position.x=x-b2.getCenter(new THREE.Vector3()).x;r.position.y=-b2.min.y;
 scene.add(r);
 if(g.animations.length){const m=new THREE.AnimationMixer(r);m.clipAction(g.animations[0]).play();mixers.push(m);}
},()=>{});}
put('A',-1.3);put('B',1.3);
let last=performance.now(),f=0;
const tick=()=>{const n=performance.now();let dt=n-last;last=n;if(dt>50)dt=50;
 for(const m of mixers)m.update(dt*0.001);
 renderer.render(scene,cam);
 if(++f<90)setTimeout(tick,16);else document.title='WT_DONE';};
tick();
})();
</script>
</body></html>
