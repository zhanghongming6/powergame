<!DOCTYPE html><html><head><meta charset="utf-8"><title>spike3d</title>
<style>html,body{margin:0;background:#111}canvas{display:block}pre{color:#7fffd4;font:20px monospace}</style>
</head><body>
<canvas id="cv3" width="640" height="360"></canvas>
<pre id="log">...</pre>
<script src="assets3d/three.min.js"></script>
<script src="assets3d/GLTFLoader.js"></script>
<script src="assets3d/SkeletonUtils.js"></script>
<script>
(function(){
const L=[];const ok=(n,c)=>L.push(n+':'+(c?'OK':'FAIL'));
let renderer=null;
try{
  renderer=new THREE.WebGLRenderer({canvas:document.getElementById('cv3'),antialias:true,preserveDrawingBuffer:true});
  ok('webgl',!!renderer.getContext());
}catch(e){ok('webgl',false);L.push('ERR:'+e.message);}
ok('rev',THREE.REVISION==='128');
ok('gltfloader',typeof THREE.GLTFLoader==='function');
ok('skelutils',typeof THREE.SkeletonUtils==='function'&&typeof THREE.SkeletonUtils.clone==='function');
let frames=0;
if(renderer){
  renderer.setSize(640,360,false);
  const scene=new THREE.Scene();scene.background=new THREE.Color(0x203040);
  const cam=new THREE.PerspectiveCamera(45,640/360,0.1,100);cam.position.set(0,2,4);cam.lookAt(0,0.5,0);
  scene.add(new THREE.AmbientLight(0xffffff,0.7));
  const dl=new THREE.DirectionalLight(0xffffff,0.8);dl.position.set(2,4,3);scene.add(dl);
  const box=new THREE.Mesh(new THREE.BoxGeometry(1,1,1),new THREE.MeshStandardMaterial({color:0x44aaff}));
  box.position.y=0.5;scene.add(box);
  const ground=new THREE.Mesh(new THREE.PlaneGeometry(10,10),new THREE.MeshStandardMaterial({color:0x336633}));
  ground.rotation.x=-Math.PI/2;scene.add(ground);
  // GLTFLoader.parse 冒烟：最小内嵌 GLB（三角形）——验证 file:// 下 parse 路径可用
  try{
    const glbB64='Z2xURgIAAACQAQAAUAEAAEpTT057ImFzc2V0Ijp7InZlcnNpb24iOiIyLjAifSwic2NlbmUiOjAsInNjZW5lcyI6W3sibm9kZXMiOlswXX1dLCJub2RlcyI6W3sibWVzaCI6MH1dLCJtZXNoZXMiOlt7InByaW1pdGl2ZXMiOlt7ImF0dHJpYnV0ZXMiOnsiUE9TSVRJT04iOjB9fV19XSwiYWNjZXNzb3JzIjpbeyJidWZmZXJWaWV3IjowLCJjb21wb25lbnRUeXBlIjo1MTI2LCJjb3VudCI6MywidHlwZSI6IlZFQzMiLCJtaW4iOlswLDAsMF0sIm1heCI6WzEsMSwwXX1dLCJidWZmZXJWaWV3cyI6W3siYnVmZmVyIjowLCJieXRlT2Zmc2V0IjowLCJieXRlTGVuZ3RoIjozNn1dLCJidWZmZXJzIjpbeyJieXRlTGVuZ3RoIjozNn1dfSAkAAAAQklOAAAAAAAAAAAAAAAAAAAAgD8AAAAAAAAAAAAAAAAAAIA/AAAAAA==';
    const buf=Uint8Array.from(atob(glbB64),c=>c.charCodeAt(0)).buffer;
    new THREE.GLTFLoader().parse(buf,'',(g)=>{ok('gltfparse',!!g.scene);},()=>{ok('gltfparse',false);});
  }catch(e){ok('gltfparse',false);}
  let last=performance.now();
  const tick=()=>{
    const now=performance.now();let dt=now-last;last=now;if(dt>50)dt=50; // 虚拟时间钳制
    box.rotation.y+=dt*0.002;frames++;
    renderer.render(scene,cam);
    if(frames<400)setTimeout(tick,16);
    else{
      ok('frames',frames>=50);
      document.getElementById('log').textContent='SPIKE '+(L.every(l=>/:OK$/.test(l))?'PASS':'FAIL')+'\n'+L.join('\n');
      document.title='SPIKE_DONE';
    }
  };
  tick();
}else{
  document.getElementById('log').textContent='SPIKE FAIL\n'+L.join('\n');
}
})();
</script>
</body></html>
